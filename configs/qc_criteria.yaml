# ============================================================================
# 缺陷判据配置
#
# 判据来源（真实文档，非编造）：
#   《催化剂单元术语及缺陷定义》
#   第 1 章 术语定义、第 2 章 缺陷定义（2.1~2.12）、主要缺陷类别规律说明
#   文件：缺陷标记.docx（2026-01 版，含 28 张典型案例图）
#
# 本文件把该文档中的定义与阈值转写为结构化判据，供 lookup_standard 检索。
# 每条判据的 clause 字段对应原文档章节号，便于回溯核对。
#
# ⚠️ 使用前请注意三点：
#   1. 文档阈值的量纲是 **mm（物理尺寸）**，而本系统相机 GSD 尚未标定。
#      因此这些 mm 阈值目前只能作为"参考"，实际等级判定走相对化口径
#      （见文件末尾 grade_thresholds）。标定 GSD 后两者可对齐。
#   2. 文档未给出"损坏"类的定义，该条留空，系统会如实返回"尚未录入"。
#   3. 处置要求（disposal）中，凡文档未明示的部分已标注"文档未明示，
#      按企业质量流程处置"，未擅自编写判定规则。
#
# 生效方式：保存后重启服务，或调用 qc_knowledge.reload_criteria()
# ============================================================================

meta:
  source: "《催化剂单元术语及缺陷定义》（缺陷标记.docx，2026-01 版）"
  effective_date: ""              # 文档未标注生效日期，请质量部补充
  owner: ""                       # 请质量部补充责任部门
  note: "判据逐条转写自上述文档 2.1~2.12 节；mm 阈值为物理尺寸，需 GSD 标定后方可精确比对"


criteria:
  # ==========================================================================
  # 材料缺失类
  # ==========================================================================

  material_loss.collapse:
    # 文档 2.1 孔塌陷（Collapsed Cell）
    standard: "催化剂单元术语及缺陷定义"
    clause: "2.1"
    criterion: >-
      催化剂孔壁或者侧壁出现变形现象，变形程度大于 50% 的孔高度，
      这类缺陷称为"孔塌陷"。
    disposal: >-
      变形程度 > 50% 孔高度即构成孔塌陷缺陷，判不合格，禁止放行；
      追溯成型与烧结工序的支撑与装窑方式。

  material_loss.channel_missing:
    # 文档 2.2 孔洞（Hole）
    standard: "催化剂单元术语及缺陷定义"
    clause: "2.2"
    criterion: >-
      发生在催化剂表面的一个缺口，由于材料没有粘合在一起而形成孔洞，
      目测可看到没有残余的材料连结在孔壁上；任何大于 18mm 深的缺口
      被称为"孔洞"。
    disposal: >-
      深度 > 18mm 属于孔洞，判不合格；同步检查同批次是否存在同类未粘合缺陷。

  material_loss.face_chip:
    # 文档 2.3 端面缺口（Face Chip）
    standard: "催化剂单元术语及缺陷定义"
    clause: "2.3"
    criterion: >-
      催化剂部分材料已经从一个孔或者多个孔上磨损掉了；深度 ≤ 18mm 判为
      "端面缺口"（当大于 18mm 时就作"孔壁缺失"缺陷处理）。
    disposal: >-
      与孔壁缺失以 18mm 深度为界分流：≤18mm 记端面缺口；>18mm 改判孔壁缺失。
      文档未明示端面缺口的合格数量上限，按企业质量流程处置。

  material_loss.missing_cell_wall:
    # 文档 2.5 孔壁缺失（Missing Cell Wall）
    standard: "催化剂单元术语及缺陷定义"
    clause: "2.5"
    criterion: >-
      当一个孔壁上的缺口宽度大于 1mm，且长度大于 18mm 时，
      被称作"缺失孔壁"（孔壁缺失）。
    disposal: >-
      同时满足"宽 > 1mm"与"长 > 18mm"即判孔壁缺失，判不合格；
      追溯挤出模具与干燥工艺。

  material_loss.sidewall_chip:
    # 文档 2.6 表皮缺口（Sidewall Chip）
    standard: "催化剂单元术语及缺陷定义"
    clause: "2.6"
    criterion: >-
      在催化剂表面上由于材料缺失产生的破口，一个或更多个孔可能受到影响，
      被称为"表皮缺口"；当表皮缺口影响到侧壁交角时，按"缺角"缺陷处理。
    disposal: >-
      未涉及侧壁交角的表皮缺口记表皮缺口；一旦影响侧壁交角，
      必须改按"缺角"的判定规则处理（见 material_loss.corner_chip）。

  material_loss.corner_chip:
    # 文档 2.7 缺角（Corner Chip），含不合格类型表
    standard: "催化剂单元术语及缺陷定义"
    clause: "2.7"
    criterion: >-
      相邻的两个侧壁交角上产生缺口时称为"缺角"。不合格类型（按缺口处
      孔数计）：1×3 缺口 ≥1 处判不合格；3×1 缺口 ≥1 处判不合格；
      2×2 缺口 ≥3 处判不合格。等价表述：行或列小于等于 3 孔算合格。
    disposal: >-
      违反上述任一不合格类型即判废（缺角优先级最高：只要涉及角部即归此类）。
      允许范围内（行或列 ≤3 孔）修磨后复检。

  material_loss.damage:
    # 文档 2.12 损坏（Damage）—— 原文档仅给出典型案例图，未给文字定义
    standard: ""
    clause: "2.12"
    criterion: ""
    disposal: ""

  # ==========================================================================
  # 缝隙分离类
  # ==========================================================================

  gap_separation.face_crack:
    # 文档 2.4 端面裂纹（Face Crack）
    standard: "催化剂单元术语及缺陷定义"
    clause: "2.4"
    criterion: >-
      沿着催化剂端面发生的宽度范围为 0.2mm~1mm 的窄裂缝称为"端面裂纹"。
    disposal: >-
      宽度落在 0.2~1mm 区间即判端面裂纹。外观属裂纹类中最需关注的一类
      （端面为密封面）；处置方式文档未明示，按企业质量流程处置。

  gap_separation.external_wall_tear:
    # 文档 2.8 侧壁撕裂（External wall tear）
    standard: "催化剂单元术语及缺陷定义"
    clause: "2.8"
    criterion: >-
      在侧壁上的一个窄间隙（宽度 > 0.2mm），一般垂直于催化剂的挤出方向
      （横向裂纹）。外壁撕裂不能超过 75mm 长或 5mm 宽。
    disposal: >-
      长度 > 75mm 或宽度 > 5mm 判不合格；未超标记关注项并加强后续工序检查。

  gap_separation.skin_crack:
    # 文档 2.9 表皮裂纹（Skin Crack）
    standard: "催化剂单元术语及缺陷定义"
    clause: "2.9"
    criterion: >-
      侧壁上产生的窄的间隙（宽度在 0.2mm~1mm 之间），
      一般平行于催化剂的挤出方向。
    disposal: >-
      宽度落在 0.2~1mm 即判表皮裂纹。与侧壁撕裂的区别在于走向：
      平行挤出方向为表皮裂纹，垂直挤出方向为侧壁撕裂。
      文档未明示合格长度上限，按企业质量流程处置。

  gap_separation.transverse_crack:
    # 文档 2.10 横向裂纹（Transverse cracks）
    standard: "催化剂单元术语及缺陷定义"
    clause: "2.10"
    criterion: >-
      孔内壁上产生垂直于催化剂的挤出方向的裂纹，称为"横向裂纹"
      （属横截面内部的隐裂，一般靠近四个角）。
    disposal: >-
      属内部隐裂，外部目检易漏，建议结合断面抽检。处置方式文档未明示，
      按企业质量流程处置。

  # ==========================================================================
  # 结构形变类
  # ==========================================================================

  deformation.shortness:
    # 文档 2.11 长度不足（Shortness）
    standard: "催化剂单元术语及缺陷定义"
    clause: "2.11"
    criterion: >-
      因切割长度不足，没切到，称为"长度不足"。
    disposal: >-
      属切割工序漏切，判不合格；追溯切割定位与长度检测环节。
      文档未明示允许偏差值，以产品图纸公称为准。


# ============================================================================
# 等级判定阈值
#
# 文档给出的阈值以 mm 为主，而本系统相机 GSD 未标定，故等级判定采用
# **相对化口径**（缺陷占样品的比例），与像素↔毫米换算无关。
#
# 下列比例阈值是按文档的严重度梯度映射而来：
#   文档中"孔壁缺失 宽>1mm 且长>18mm"、"侧壁撕裂 长>75mm 或宽>5mm"
#   "缺角 行或列>3孔" 均视为严重档；
#   "端面缺口 深≤18mm"、"表皮缺口 未涉及角" 视为较重档；
#   裂纹类（宽 0.2~1mm 的窄缝隙）在面积占比上通常较小，落在轻微档。
#
# ⚠️ 这是**工程近似**，不是文档原文给出的比例值。待 GSD 标定后应改为
#    绝对 mm 判定，并请质量部确认比例阈值。
# ============================================================================

grade_thresholds:
  critical:
    area_ratio: 0.06              # 缺陷面积 > 样品面积 6%
    len_ratio: 0.25               # 或 缺陷长边 > 样品边长 25%
  major:
    area_ratio: 0.02              # 缺陷面积 > 样品面积 2%
    len_ratio: 0.12               # 或 缺陷长边 > 样品边长 12%
  # minor 为其余情况
